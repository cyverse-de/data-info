apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-info
spec:
  replicas: 2
  selector:
    matchLabels:
      de-app: data-info
  strategy:
    rollingUpdate:
      maxSurge: 200%
  template:
    metadata:
      labels:
        de-app: data-info
    spec:
      restartPolicy: Always
      # Covers the shutdown drain: 5s preStop + 30s serverGrace + 75s drainGrace
      # (cmd/data-info/main.go). A SIGKILL mid-drain leaves job paths locked until the
      # 10-minute stall timeout.
      terminationGracePeriodSeconds: 120
      volumes:
        - name: data-info-configs
          secret:
            secretName: data-info-configs
            items:
              - key: data-info.yml
                path: data-info.yml
      containers:
        - name: data-info
          image: harbor.cyverse.org/de/data-info
          # A quarter of the Clojure service's memory and a tenth of its CPU floor. The JVM
          # numbers were sized around a heap and a JIT; this process has neither.
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "128Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
              ephemeral-storage: "128Mi"
          args:
            - --config
            - /etc/iplant/de/data-info.yml
          lifecycle:
            # Endpoint removal and SIGTERM race, so hold still long enough for kube-proxy to
            # drop this pod before the server stops accepting. Kubernetes' own sleep handler
            # rather than an exec: the image is distroless and has no shell to run one with.
            preStop:
              sleep:
                seconds: 5
          volumeMounts:
            - name: data-info-configs
              mountPath: /etc/iplant/de
              readOnly: true
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: timezone
                  key: timezone
          ports:
            - name: listen-port
              containerPort: 60000
          # /healthz answers from memory, so liveness and the startup gate can poll it freely.
          # Readiness checks only the catalog, which is why it alone runs on a 20s period. It
          # leaves iRODS alone so the probes spend none of the Data Store's per-node connections.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 60000
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /healthz
              port: 60000
            periodSeconds: 3
            timeoutSeconds: 5
            failureThreshold: 100
          readinessProbe:
            httpGet:
              path: /readyz
              port: 60000
            periodSeconds: 20
            timeoutSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: data-info
spec:
  selector:
    de-app: data-info
  ports:
    - protocol: TCP
      port: 80
      targetPort: listen-port
