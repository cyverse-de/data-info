# GET /data/path/{zone}/* serves a folder listing for a collection and the file's own bytes
# for a data object. The listing half is in listing.yaml; this is the other one.
#
# A caveat worth knowing when reading a green report: the harness compares status and body,
# and a download's body is compared byte for byte because neither side's is JSON. It does not
# compare headers, so the Content-Type and the RFC 6266 Content-Disposition these cases
# exercise are *not* checked here. internal/handlers/download_test.go pins the header; these
# cases pin the bytes.
group: downloads
cases:
  - id: download-a-file
    tier: write
    method: GET
    path: /data/path{{.SeedPath}}
    query: {user: "{{.User}}"}
    seed: {filename: download.txt, content: "the contents of the file\n"}

  - id: download-as-an-attachment
    tier: write
    method: GET
    path: /data/path{{.SeedPath}}
    query: {user: "{{.User}}", attachment: "true"}
    seed: {filename: download-attached.txt, content: "the contents of the file\n"}

  # The reference answers this without opening the object at all, so it is the case that
  # catches a short circuit returning the wrong thing.
  - id: download-an-empty-file
    tier: write
    method: GET
    path: /data/path{{.SeedPath}}
    query: {user: "{{.User}}"}
    seed: {filename: download-empty.txt, content: ""}

  # Multi-byte characters, so a download that decodes and re-encodes rather than copying
  # bytes shows up as a body difference.
  #
  # The extension is .txt on purpose. A name the media-type table does not know sends the
  # reference to Tika's content sniffing, which this service deliberately does not do
  # (deferred fix 11) -- so such a case would report that accepted divergence on every run
  # instead of testing what it is here to test. upload-with-no-extension covers the
  # divergence itself, once.
  - id: download-multibyte-content
    tier: write
    method: GET
    path: /data/path{{.SeedPath}}
    query: {user: "{{.User}}"}
    seed: {filename: download-multibyte.txt, content: "caf\u00e9 \u4e16\u754c \U0001F600\n"}

  - id: download-a-file-whose-name-has-spaces
    tier: write
    method: GET
    path: /data/path{{.SeedPath}}
    query: {user: "{{.User}}", attachment: "true"}
    seed: {filename: "a download.txt", content: "spaces in the name\n"}

  - id: download-a-file-whose-name-is-not-ascii
    tier: write
    method: GET
    path: /data/path{{.SeedPath}}
    query: {user: "{{.User}}", attachment: "true"}
    seed: {filename: "r\u00e9sum\u00e9.txt", content: "not ascii\n"}

  - id: download-a-missing-file
    tier: write
    method: GET
    path: /data/path{{.Root}}/definitely-not-here
    query: {user: "{{.User}}"}

  - id: download-unknown-user
    tier: write
    method: GET
    path: /data/path{{.SeedPath}}
    query: {user: nosuchuser}
    seed: {filename: download-unknown-user.txt, content: "hello\n"}
