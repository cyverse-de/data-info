group: mutations
cases:
  # Each of these gets its own copy of the fixture, and both the response and what the write
  # left behind are compared. Task ids and the random suffix a trashed name gets are
  # canonicalised out, so what is compared is where things ended up rather than what they were
  # called on the way.
  #
  # Cases whose endpoint returns before the work is done are tier async: the harness waits
  # for the task to carry an end date before reading the tree, and compares the status trail
  # as well. The end date is the wait's real subject -- it is what releases the path lock --
  # so a case that gets one has watched the lock being freed too.
  #
  # The error paths of the same endpoints stay tier write. They fail validation and return
  # without creating a task, so there is nothing to wait for.

  - id: move-a-file
    tier: async
    method: POST
    path: /mover
    query: {user: "{{.User}}"}
    seed: {filename: movable.txt, content: "move me\n"}
    body: {sources: ["{{.SeedPath}}"], dest: "{{.Root}}/elsewhere"}

  - id: move-a-file-onto-itself
    tier: async
    method: POST
    path: /mover
    query: {user: "{{.User}}"}
    seed: {filename: staying.txt, content: "already there\n"}
    body: {sources: ["{{.SeedPath}}"], dest: "{{.Root}}"}

  - id: move-to-a-missing-destination
    tier: write
    method: POST
    path: /mover
    query: {user: "{{.User}}"}
    seed: {filename: movable.txt, content: "move me\n"}
    body: {sources: ["{{.SeedPath}}"], dest: "{{.Root}}/nowhere"}

  - id: move-something-that-is-not-there
    tier: write
    method: POST
    path: /mover
    query: {user: "{{.User}}"}
    body: {sources: ["{{.Root}}/missing"], dest: "{{.Root}}"}

  - id: move-with-no-sources
    tier: write
    method: POST
    path: /mover
    query: {user: "{{.User}}"}
    body: {sources: [], dest: "{{.Root}}"}

  - id: move-unknown-user
    tier: write
    method: POST
    path: /mover
    query: {user: nosuchuser}
    body: {sources: ["{{.Root}}/x"], dest: "{{.Root}}"}

  - id: rename-to-the-same-name
    tier: write
    method: PUT
    path: /data/{{.SeedID}}/name
    query: {user: "{{.User}}"}
    seed: {filename: unchanged.txt, content: "same name\n"}
    body: {filename: unchanged.txt}

  - id: rename-a-file
    tier: async
    method: PUT
    path: /data/{{.SeedID}}/name
    query: {user: "{{.User}}"}
    seed: {filename: before.txt, content: "renamed\n"}
    body: {filename: after.txt}

  - id: rename-an-unknown-id
    tier: write
    method: PUT
    path: /data/00000000-0000-0000-0000-000000000000/name
    query: {user: "{{.User}}"}
    body: {filename: whatever.txt}

  - id: rename-with-a-blank-name
    tier: write
    method: PUT
    path: /data/{{.SeedID}}/name
    query: {user: "{{.User}}"}
    seed: {filename: named.txt, content: "named\n"}
    body: {filename: ""}

  - id: delete-a-file
    tier: async
    method: POST
    path: /deleter
    query: {user: "{{.User}}"}
    seed: {filename: doomed.txt, content: "delete me\n"}
    body: {paths: ["{{.SeedPath}}"]}

  - id: delete-something-that-is-not-there
    tier: write
    method: POST
    path: /deleter
    query: {user: "{{.User}}"}
    body: {paths: ["{{.Root}}/missing"]}

  - id: delete-with-no-paths
    tier: write
    method: POST
    path: /deleter
    query: {user: "{{.User}}"}
    body: {paths: []}

  # The one path a user may never delete: everything they have lives under it, including the
  # trash the deletion would try to use.
  - id: delete-a-home-directory
    tier: write
    method: POST
    path: /deleter
    query: {user: "{{.User}}"}
    body: {paths: ["/{{.Zone}}/home/{{.User}}"]}

  # Restoring needs the object to be in the trash, which takes a delete first -- two requests
  # in one case, which the catalog cannot express yet. It is the gap worth closing next: the
  # collision rename a restore does when something already occupies the original path is
  # exactly the kind of outcome only a state probe catches.
  - id: restore-a-deleted-file
    tier: async
    method: POST
    path: /restorer
    query: {user: "{{.User}}"}
    body: {paths: ["{{.Root}}/doomed.txt"]}
    skip: >-
      needs a delete to run first, and a case is one request; the multi-step case model is
      not built yet

  - id: restore-an-empty-selection
    tier: write
    method: POST
    path: /restorer
    query: {user: "{{.User}}"}
    body: {paths: ["{{.Root}}/not-in-the-trash"]}

  - id: share-with-yourself
    tier: write
    method: POST
    path: /sharer
    query: {user: "{{.User}}"}
    seed: {filename: shared.txt, content: "shared\n"}
    body:
      sharing:
        - user: "{{.User}}"
          paths:
            - {path: "{{.SeedPath}}", permission: read}

  - id: share-with-an-unknown-user
    tier: write
    method: POST
    path: /sharer
    query: {user: "{{.User}}"}
    seed: {filename: shared.txt, content: "shared\n"}
    body:
      sharing:
        - user: nosuchuser
          paths:
            - {path: "{{.SeedPath}}", permission: read}

  - id: share-something-that-is-not-there
    tier: write
    method: POST
    path: /sharer
    query: {user: "{{.User}}"}
    body:
      sharing:
        - user: "{{.User}}"
          paths:
            - {path: "{{.Root}}/missing", permission: read}

  - id: unshare-from-yourself
    tier: write
    method: POST
    path: /unsharer
    query: {user: "{{.User}}"}
    seed: {filename: shared.txt, content: "shared\n"}
    body:
      unshare:
        - user: "{{.User}}"
          paths: ["{{.SeedPath}}"]

  - id: unshare-from-an-unknown-user
    tier: write
    method: POST
    path: /unsharer
    query: {user: "{{.User}}"}
    seed: {filename: shared.txt, content: "shared\n"}
    body:
      unshare:
        - user: nosuchuser
          paths: ["{{.SeedPath}}"]

  - id: list-tickets-for-a-path-with-none
    tier: write
    method: POST
    path: /ticket-lister
    query: {user: "{{.User}}"}
    seed: {filename: unticketed.txt, content: "no tickets\n"}
    body: {paths: ["{{.SeedPath}}"]}

  - id: list-tickets-for-something-that-is-not-there
    tier: write
    method: POST
    path: /ticket-lister
    query: {user: "{{.User}}"}
    body: {paths: ["{{.Root}}/missing"]}

  - id: delete-a-ticket-that-does-not-exist
    tier: write
    method: POST
    path: /ticket-deleter
    query: {user: "{{.User}}"}
    body: {tickets: ["NOSUCHTICKET"]}

  - id: get-a-group-that-does-not-exist
    tier: read
    method: GET
    path: /groups/definitely-not-a-group
    query: {user: "{{.User}}"}

  - id: create-a-group-as-an-ordinary-user
    tier: write
    method: POST
    path: /groups
    query: {user: "{{.User}}"}
    body: {name: shadow-harness-group, members: []}

  - id: delete-a-group-as-an-ordinary-user
    tier: write
    method: DELETE
    path: /groups/definitely-not-a-group
    query: {user: "{{.User}}"}

  # Metadata. These merge what the metadata service holds with what iRODS does, so a
  # difference here can come from either side.
  - id: list-metadata-for-an-unknown-id
    tier: read
    method: GET
    path: /data/00000000-0000-0000-0000-000000000000/metadata
    query: {user: "{{.User}}"}

  - id: add-a-reserved-avu
    tier: write
    method: PATCH
    path: /data/{{.SeedID}}/metadata
    query: {user: "{{.User}}"}
    seed: {filename: tagged.txt, content: "tag me\n"}
    body: {irods-avus: [{attr: "ipc-not-yours", value: "no", unit: ""}]}

  - id: add-an-avu
    tier: write
    method: PATCH
    path: /data/{{.SeedID}}/metadata
    query: {user: "{{.User}}"}
    seed: {filename: tagged.txt, content: "tag me\n"}
    body: {irods-avus: [{attr: "harness-attr", value: "harness-value", unit: ""}]}

  - id: set-avus-to-an-empty-list
    tier: write
    method: PUT
    path: /data/{{.SeedID}}/metadata
    query: {user: "{{.User}}"}
    seed: {filename: tagged.txt, content: "tag me\n"}
    body: {irods-avus: []}

  - id: metadata-save-to-a-missing-directory
    tier: write
    method: POST
    path: /data/{{.SeedID}}/metadata/save
    query: {user: "{{.User}}"}
    seed: {filename: described.txt, content: "describe me\n"}
    body: {dest: "{{.Root}}/nowhere/out.json", recursive: false}

  - id: path-list-from-an-empty-selection
    tier: write
    method: POST
    path: /path-list-creator
    query: {user: "{{.User}}", dest: "{{.Root}}/list.txt"}
    body: {paths: ["{{.Root}}/nothing-here"]}

  - id: path-list-with-no-destination
    tier: write
    method: POST
    path: /path-list-creator
    query: {user: "{{.User}}"}
    body: {paths: ["{{.Root}}"]}
